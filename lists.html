<html>
<head>
	<title>HTML LISTS</title>
</head>
<body>
<!--Ordered Lists-->
#Ordered Lists#
	<ol type="1"  start="10">
		<li>HTML</li>
		<li>JAVA</li>
		<li>CSS</li>
	</ol>
<!--UnOrdered Lists-->
#UnOrdered Lists#
	<ul style="list-style-type:circle">
	<li>HTML</li>
	<li>JAVA</li>
	<li>CSS</li>
	</ul>
<!--Description Lists-->
#Description Lists#
	<dl>
		<dt>Welcome to HTML</dt>
		<dd>DESCRIPTION LISTS</dd>
	</dl>
<!--Nested Lists-->
#Nested Lists#
	<ul>
		<li>Frontend
			<ol><li>HTML</li>
			    <li>JAVA</li>
			    <li>CSS</li>
			</ol>
		</li>
		<li>Backend
			<ol><li>Html</li>
				<li>Java</li>
				<li>Css</li>
			</ol>
		</li>
	</ul>
</body>
</html>
