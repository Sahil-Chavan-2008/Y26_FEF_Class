<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body bgcolor="lightblue">
    <h1>Registraion Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
        <label>Student Name:</label>
        <input type="text" placeholder="Enter your name" name="sname" required >
        <br><br>
        <label>Email:</label>
        <input type="email"
         placeholder="Enter your email" required>
        <br><br>
        <label>Password</label>
        <input type="text"
         placeholder="Enter password" required>
        </fieldset>
        <br><br>
        <label>Age</label>
        <input type="number"
         placeholder="Enter Age" min="18" max="50" required>
        <br><br>
        <label>Gender:</label>
        <input type="radio"
                value="Male"> Male
        <input type="radio"
                value="Female"> Female
    </form>
</body>
</html>
