<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h2> HTML TABLE TAG EXAMPLE</h2>

    <table border="1">

        <caption>Student Marks Details</caption>

        <colgroup>
            <col style="background-color: lightblue;">
            <col style="background-color: lightgreen;">
            <col style="background-color: lightslategray;">
        </colgroup>

        <thead>
        <tr>
            <th>Student Name</th>
            <th>Subjects</th>
            <th>Marks</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td rowspan="2" style="padding: 20px;">RAJU</td>
            <td>Html</td>
            <td>99</td>
        </tr>
        <tr>
            
            <td>FSD</td>
            <td>99</td>
        </tr>
        <tr>
            <td rowspan="2">Surii</td>
            <td>FSD</td>
            <td>99</td>
        </tr>
        <tr>
            
            <td>Html</td>
            <td>99</td>
        </tr>
        </tbody>
        <tfoot>
         <tr>
            <th colspan="2">Total Students</th>
            
            <td>2</td>
        </tr>
        </tfoot>
    </table>
    
</body>
</html>
